<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
    aria-labelledby="title desc">
    <title id="title">BigLinuxCleaner</title>
    <desc id="desc">Logo oficial do Big Linux (B com faixa diagonal) combinado com uma vassoura varrendo faíscas.</desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6fbff" />
            <stop offset="1" stop-color="#d6e9ff" />
        </linearGradient>
        <linearGradient id="bigGrad" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="450">
            <stop offset="0" stop-color="#0c3c8f" />
            <stop offset="0.55" stop-color="#0f6fd6" />
            <stop offset="1" stop-color="#11b4f0" />
        </linearGradient>
        <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e8ad64" />
            <stop offset="1" stop-color="#c9853e" />
        </linearGradient>
        <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f8da7e" />
            <stop offset="1" stop-color="#e9bd59" />
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a2f6b" flood-opacity="0.28" />
        </filter>
        <g id="sparkle">
            <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="#1b6df2" />
        </g>
    </defs>

    <!-- Fundo claro (estilo do site Big Linux) -->
    <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)" />
    <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />

    <!-- Logo oficial do Big Linux: B bold inclinado com faixa diagonal no meio -->
    <g filter="url(#softShadow)" transform="translate(235,252) scale(0.78) rotate(38) translate(-125,-175)">
        <path d="M 0,0 H 62 C 192,0 250,42 250,116 V 136 L 0,222 Z" fill="url(#bigGrad)" />
        <path d="M 0,238 L 250,152 V 296 C 250,344 196,350 124,350 L 0,350 Z" fill="url(#bigGrad)" />
    </g>

    <!-- Vassoura -->
    <line x1="448" y1="64" x2="330" y2="320" stroke="url(#handle)" stroke-width="24" stroke-linecap="round" />
    <line x1="440" y1="72" x2="333" y2="315" stroke="#f8d9a8" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <line x1="338" y1="328" x2="310" y2="308" stroke="#5c6b7a" stroke-width="22" stroke-linecap="round" />
    <path d="M 330,318 L 236,368 L 252,424 L 322,404 Z" fill="url(#bristles)" />
    <g stroke="#c89b3f" stroke-width="4" stroke-linecap="round" opacity="0.6">
        <line x1="328" y1="320" x2="242" y2="372" />
        <line x1="328" y1="320" x2="250" y2="398" />
        <line x1="328" y1="320" x2="268" y2="416" />
        <line x1="328" y1="320" x2="292" y2="424" />
    </g>

    <!-- Poeira e faíscas varridas -->
    <g fill="#3f9ce0">
        <circle cx="196" cy="400" r="6" />
        <circle cx="170" cy="432" r="4" />
        <circle cx="222" cy="448" r="5" />
        <circle cx="152" cy="382" r="3.5" />
        <circle cx="254" cy="456" r="3" />
    </g>
    <use href="#sparkle" transform="translate(112,120) scale(0.85)" />
    <use href="#sparkle" transform="translate(442,442) scale(0.7)" />
    <use href="#sparkle" transform="translate(468,150) scale(0.6)" />
    <use href="#sparkle" transform="translate(150,70) scale(0.5)" />
</svg>